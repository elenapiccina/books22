<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bookshelf</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --pistachio:#C9D9C2;
  --pistachio-light:#E3EBDD;
  --pistachio-dark:#AFC4A6;

  --champagne:#F3EBDD;
  --champagne-light:#FBF8F1;
  --cream:#F7F3EA;

  --dark:#444441;
  --muted:#817F77;
  --white:#FFFDF8;

  --border:rgba(68,68,65,.12);
  --shadow:0 12px 35px rgba(68,68,65,.07);

  --radius:18px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%, rgba(201,217,194,.35), transparent 25%),
    radial-gradient(circle at 90% 20%, rgba(243,235,221,.65), transparent 30%),
    var(--cream);

  color:var(--dark);

  font-family:"Plus Jakarta Sans",sans-serif;
  font-weight:300;

  min-height:100vh;
}

button,
input,
select{
  font-family:"Plus Jakarta Sans",sans-serif;
}

button{
  cursor:pointer;
}

.app{
  width:min(1080px,94%);
  margin:28px auto 45px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:22px;
}

.title{
  font-family:"Playfair Display",serif;
  font-weight:400;
  font-size:38px;
  line-height:1;
  margin:0 0 7px;
}

.subtitle{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.4px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:rgba(255,253,248,.8);
  color:var(--dark);
  padding:9px 14px;
  border-radius:999px;
  font-size:11px;
  font-weight:300;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  background:var(--white);
}

.btn.primary{
  background:var(--pistachio);
  border-color:transparent;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.stat{
  background:rgba(255,253,248,.72);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 14px;
}

.stat-number{
  font-family:"Playfair Display",serif;
  font-size:24px;
}

.stat-label{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

/* SHELVES */

.shelves{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.shelf{
  background:rgba(255,253,248,.68);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;

  min-height:390px;

  box-shadow:var(--shadow);

  transition:.2s ease;
}

.shelf.drag-over{
  background:var(--pistachio-light);
  transform:translateY(-2px);
}

.shelf-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.shelf-name{
  display:flex;
  align-items:center;
  gap:7px;

  font-family:"Playfair Display",serif;
  font-size:19px;
}

.shelf-count{
  min-width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--champagne);
  color:var(--muted);

  font-size:9px;
}

.shelf-tools{
  display:flex;
  gap:4px;
}

.icon-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  width:25px;
  height:25px;
  border-radius:50%;
  font-size:12px;
}

.icon-btn:hover{
  background:var(--champagne);
}

/* BOOK CARD */

.books{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:300px;
}

.book{
  display:grid;
  grid-template-columns:52px 1fr;
  gap:10px;

  background:var(--white);
  border:1px solid rgba(68,68,65,.08);

  border-radius:13px;
  padding:8px;

  cursor:grab;

  transition:.2s ease;
}

.book:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(68,68,65,.08);
}

.book.dragging{
  opacity:.45;
}

.cover{
  width:52px;
  height:72px;
  border-radius:7px;
  overflow:hidden;
  background:
    linear-gradient(135deg,var(--pistachio-light),var(--champagne));
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover-placeholder{
  font-family:"Playfair Display",serif;
  font-size:18px;
  color:var(--pistachio-dark);
}

.book-info{
  min-width:0;
  position:relative;
  padding-right:3px;
}

.book-title{
  font-family:"Playfair Display",serif;
  font-size:15px;
  line-height:1.15;
  margin-bottom:3px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.author{
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.book-meta{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.badge{
  background:var(--champagne);
  border-radius:999px;
  padding:3px 6px;
  font-size:8px;
  color:var(--muted);
}

.book-actions{
  position:absolute;
  right:0;
  top:-2px;

  display:flex;
  gap:1px;

  opacity:0;
  transition:.15s;
}

.book:hover .book-actions{
  opacity:1;
}

.mini-btn{
  border:0;
  background:var(--champagne-light);
  color:var(--muted);

  width:22px;
  height:22px;

  border-radius:50%;
  font-size:10px;
}

.progress{
  margin-top:7px;
  height:4px;
  background:#ECE9DF;
  border-radius:99px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--pistachio-dark);
  border-radius:99px;
  transition:.3s;
}

.progress-text{
  font-size:8px;
  color:var(--muted);
  margin-top:3px;
}

/* EMPTY */

.empty{
  border:1px dashed rgba(68,68,65,.16);
  border-radius:12px;
  padding:23px 10px;
  text-align:center;

  color:var(--muted);
  font-size:10px;

  background:rgba(243,235,221,.22);
}

.empty-icon{
  font-size:20px;
  margin-bottom:5px;
}

/* ADD */

.add-book{
  width:100%;
  border:1px dashed rgba(68,68,65,.17);
  background:transparent;

  border-radius:10px;
  padding:8px;

  color:var(--muted);
  font-size:10px;

  margin-top:9px;
}

.add-book:hover{
  background:var(--champagne-light);
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(58,58,55,.25);
  backdrop-filter:blur(5px);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(430px,100%);
  background:var(--white);

  border-radius:22px;
  padding:21px;

  box-shadow:0 25px 80px rgba(50,50,45,.18);
}

.modal-title{
  font-family:"Playfair Display",serif;
  font-size:24px;
  margin-bottom:16px;
}

.form{
  display:grid;
  gap:10px;
}

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:9px;
  color:var(--muted);
  letter-spacing:.5px;
}

.field input,
.field select{
  width:100%;

  border:1px solid var(--border);
  background:var(--champagne-light);

  border-radius:10px;

  padding:9px 10px;

  color:var(--dark);
  font-size:11px;
  font-weight:300;

  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--pistachio-dark);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:15px;
}

/* IMAGE PREVIEW */

.image-preview{
  display:none;
  width:55px;
  height:72px;
  border-radius:7px;
  object-fit:cover;
  margin-top:5px;
}

.image-preview.show{
  display:block;
}

/* EFFECTS */

.float{
  position:fixed;
  pointer-events:none;
  z-index:500;

  animation:floatUp 1.5s ease forwards;

  font-size:17px;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(.7);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-80px) scale(1.15);
    opacity:0;
  }
}

/* MOBILE */

@media(max-width:800px){
  .shelves{
    grid-template-columns:1fr;
  }

  .shelf{
    min-height:0;
  }

  .books{
    min-height:40px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:520px){
  .app{
    margin-top:20px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .title{
    font-size:32px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    padding:9px;
  }

  .stat-number{
    font-size:20px;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div>
      <h1 class="title">my bookshelf</h1>
      <div class="subtitle">
        books I loved · books I'm reading · books waiting for me
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="renameShelves()">✎ shelves</button>
      <button class="btn primary" onclick="openAdd()">＋ add book</button>
    </div>

  </header>


  <section class="stats">

    <div class="stat">
      <div class="stat-number" id="totalBooks">0</div>
      <div class="stat-label">all books</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="finishedBooks">0</div>
      <div class="stat-label">finished</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="pagesRead">0</div>
      <div class="stat-label">pages read</div>
    </div>

  </section>


  <main class="shelves" id="shelves"></main>

</div>


<!-- MODAL -->

<div class="overlay" id="overlay">

  <div class="modal">

    <div class="modal-title" id="modalTitle">
      add a book
    </div>

    <div class="form">

      <div class="field">
        <label>BOOK TITLE</label>
        <input id="bookTitle" placeholder="The Creative Act">
      </div>

      <div class="field">
        <label>AUTHOR</label>
        <input id="bookAuthor" placeholder="Rick Rubin">
      </div>

      <div class="form-row">

        <div class="field">
          <label>PAGES</label>
          <input id="bookPages" type="number" min="0" placeholder="320">
        </div>

        <div class="field">
          <label>SHELF</label>

          <select id="bookShelf">
          </select>

        </div>

      </div>


      <div class="field">

        <label>COVER IMAGE URL</label>

        <input
          id="bookImage"
          placeholder="https://..."
          oninput="previewImage()"
        >

        <img id="imagePreview" class="image-preview">

      </div>


      <div class="field" id="progressField">

        <label>READING PROGRESS %</label>

        <input
          id="bookProgress"
          type="number"
          min="0"
          max="100"
          value="0"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button class="btn" onclick="closeModal()">
        cancel
      </button>

      <button class="btn primary" onclick="saveBook()">
        save book
      </button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "my_bookshelf_v1";

const defaultData = {
  shelves:[
    {
      id:"finished",
      name:"finished",
      emoji:"✓",
      color:"#C9D9C2",
      books:[]
    },
    {
      id:"current",
      name:"currently reading",
      emoji:"◌",
      color:"#E5DCC9",
      books:[]
    },
    {
      id:"want",
      name:"want to read",
      emoji:"♡",
      color:"#D9E4D2",
      books:[]
    }
  ]
};

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
) || defaultData;

let editingId = null;


/* SAVE */

function saveData(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


/* RENDER */

function render(){

  const container =
    document.getElementById("shelves");

  container.innerHTML = "";

  data.shelves.forEach(shelf => {

    const section =
      document.createElement("section");

    section.className = "shelf";

    section.dataset.shelf = shelf.id;

    section.addEventListener(
      "dragover",
      e => {
        e.preventDefault();
        section.classList.add("drag-over");
      }
    );

    section.addEventListener(
      "dragleave",
      () => {
        section.classList.remove("drag-over");
      }
    );

    section.addEventListener(
      "drop",
      e => {

        e.preventDefault();

        section.classList.remove("drag-over");

        const bookId =
          e.dataTransfer.getData("bookId");

        const fromShelf =
          e.dataTransfer.getData("fromShelf");

        moveBook(
          bookId,
          fromShelf,
          shelf.id
        );
      }
    );


    section.innerHTML = `

      <div class="shelf-header">

        <div class="shelf-name">

          <span>${shelf.emoji}</span>

          <span>${escapeHtml(shelf.name)}</span>

          <span class="shelf-count">
            ${shelf.books.length}
          </span>

        </div>

        <div class="shelf-tools">

          <button
            class="icon-btn"
            title="Add book"
            onclick="openAdd('${shelf.id}')"
          >
            ＋
          </button>

        </div>

      </div>

      <div class="books"></div>

      <button
        class="add-book"
        onclick="openAdd('${shelf.id}')"
      >
        ＋ add a book
      </button>

    `;


    const booksContainer =
      section.querySelector(".books");


    if(!shelf.books.length){

      booksContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ${shelf.id === "finished" ? "✦" :
              shelf.id === "current" ? "☕" : "♡"}
          </div>

          <div>
            ${shelf.id === "finished"
              ? "books you've completed"
              : shelf.id === "current"
              ? "your current read"
              : "your next adventure"}
          </div>

        </div>

      `;

    }


    shelf.books.forEach(book => {

      const card =
        document.createElement("div");

      card.className = "book";

      card.draggable = true;

      card.dataset.book = book.id;


      card.addEventListener(
        "dragstart",
        e => {

          card.classList.add("dragging");

          e.dataTransfer.setData(
            "bookId",
            book.id
          );

          e.dataTransfer.setData(
            "fromShelf",
            shelf.id
          );

        }
      );


      card.addEventListener(
        "dragend",
        () => {
          card.classList.remove("dragging");
        }
      );


      const progress =
        Math.max(
          0,
          Math.min(
            100,
            Number(book.progress || 0)
          )
        );


      const image = book.image
        ? `
          <img
            src="${escapeAttr(book.image)}"
            alt=""
            onerror="this.style.display='none'"
          >
        `
        : `
          <div class="cover-placeholder">
            ${book.title
              ? escapeHtml(book.title.charAt(0).toUpperCase())
              : "♡"}
          </div>
        `;


      card.innerHTML = `

        <div class="cover">
          ${image}
        </div>

        <div class="book-info">

          <div class="book-actions">

            <button
              class="mini-btn"
              onclick="editBook(event,'${book.id}')"
              title="Edit"
            >
              ✎
            </button>

            <button
              class="mini-btn"
              onclick="deleteBook(event,'${book.id}')"
              title="Delete"
            >
              ×
            </button>

          </div>

          <div class="book-title">
            ${escapeHtml(book.title || "Untitled")}
          </div>

          <div class="author">
            ${escapeHtml(book.author || "Unknown author")}
          </div>

          <div class="book-meta">

            ${
              book.pages
              ? `<span class="badge">♡ ${book.pages} pages</span>`
              : ""
            }

            ${
              shelf.id === "finished"
              ? `<span class="badge">finished</span>`
              : ""
            }

          </div>

          ${
            shelf.id === "current"
            ? `
              <div class="progress">
                <div
                  class="progress-bar"
                  style="width:${progress}%"
                ></div>
              </div>

              <div class="progress-text">
                ${progress}% read
              </div>
            `
            : ""
          }

        </div>

      `;

      booksContainer.appendChild(card);

    });


    container.appendChild(section);

  });


  updateStats();

}


/* ADD */

function openAdd(shelfId){

  editingId = null;

  document.getElementById("modalTitle")
    .textContent = "add a book";

  document.getElementById("bookTitle").value = "";

  document.getElementById("bookAuthor").value = "";

  document.getElementById("bookPages").value = "";

  document.getElementById("bookImage").value = "";

  document.getElementById("bookProgress").value = 0;

  document.getElementById("imagePreview")
    .classList.remove("show");


  const select =
    document.getElementById("bookShelf");

  select.innerHTML =
    data.shelves.map(
      shelf =>
        `<option value="${shelf.id}">
          ${escapeHtml(shelf.name)}
        </option>`
    ).join("");


  select.value =
    shelfId || data.shelves[2].id;


  document.getElementById("overlay")
    .classList.add("show");

}


/* EDIT */

function editBook(event,id){

  event.stopPropagation();

  let found = findBook(id);

  if(!found) return;

  editingId = id;

  const book = found.book;

  document.getElementById("modalTitle")
    .textContent = "edit book";

  document.getElementById("bookTitle").value =
    book.title || "";

  document.getElementById("bookAuthor").value =
    book.author || "";

  document.getElementById("bookPages").value =
    book.pages || "";

  document.getElementById("bookImage").value =
    book.image || "";

  document.getElementById("bookProgress").value =
    book.progress || 0;


  const select =
    document.getElementById("bookShelf");

  select.innerHTML =
    data.shelves.map(
      shelf =>
        `<option value="${shelf.id}">
          ${escapeHtml(shelf.name)}
        </option>`
    ).join("");

  select.value = found.shelf.id;


  previewImage();

  document.getElementById("overlay")
    .classList.add("show");

}


/* SAVE BOOK */

function saveBook(){

  const title =
    document.getElementById("bookTitle").value.trim();

  if(!title){

    alert("Add a book title first.");

    return;
  }


  const author =
    document.getElementById("bookAuthor").value.trim();

  const pages =
    Number(
      document.getElementById("bookPages").value
    ) || 0;

  const image =
    document.getElementById("bookImage").value.trim();

  const progress =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          document.getElementById("bookProgress").value
        ) || 0
      )
    );

  const shelfId =
    document.getElementById("bookShelf").value;


  if(editingId){

    const found =
      findBook(editingId);

    if(!found) return;

    const book = found.book;

    book.title = title;
    book.author = author;
    book.pages = pages;
    book.image = image;
    book.progress = progress;


    if(found.shelf.id !== shelfId){

      found.shelf.books =
        found.shelf.books.filter(
          b => b.id !== editingId
        );

      const target =
        data.shelves.find(
          s => s.id === shelfId
        );

      target.books.push(book);

    }

    celebrate("♡");

  }else{

    const book = {

      id:
        Date.now().toString() +
        Math.random().toString(36).slice(2),

      title,
      author,
      pages,
      image,
      progress

    };


    const shelf =
      data.shelves.find(
        s => s.id === shelfId
      );

    shelf.books.push(book);

    celebrate("✦");

  }


  saveData();

  closeModal();

  render();

}


/* MOVE BOOK */

function moveBook(
  bookId,
  fromShelfId,
  toShelfId
){

  if(fromShelfId === toShelfId) return;


  const fromShelf =
    data.shelves.find(
      s => s.id === fromShelfId
    );

  const toShelf =
    data.shelves.find(
      s => s.id === toShelfId
    );


  if(!fromShelf || !toShelf) return;


  const index =
    fromShelf.books.findIndex(
      b => b.id === bookId
    );


  if(index === -1) return;


  const [book] =
    fromShelf.books.splice(index,1);


  if(toShelf.id === "finished"){
    book.progress = 100;
  }

  if(toShelf.id === "want"){
    book.progress = 0;
  }


  toShelf.books.push(book);

  saveData();

  render();

  celebrate("♡");

}


/* DELETE */

function deleteBook(event,id){

  event.stopPropagation();

  if(!confirm("Remove this book?")) return;


  data.shelves.forEach(
    shelf => {

      shelf.books =
        shelf.books.filter(
          book => book.id !== id
        );

    }
  );


  saveData();

  render();

  celebrate("×");

}


/* FIND */

function findBook(id){

  for(const shelf of data.shelves){

    const book =
      shelf.books.find(
        b => b.id === id
      );

    if(book){

      return {
        book,
        shelf
      };

    }

  }

  return null;

}


/* RENAME SHELVES */

function renameShelves(){

  data.shelves.forEach(shelf => {

    const name =
      prompt(
        `Rename "${shelf.name}"`,
        shelf.name
      );

    if(name && name.trim()){

      shelf.name =
        name.trim();

    }

  });

  saveData();

  render();

}


/* IMAGE PREVIEW */

function previewImage(){

  const url =
    document.getElementById("bookImage").value.trim();

  const preview =
    document.getElementById("imagePreview");


  if(!url){

    preview.classList.remove("show");

    return;

  }


  preview.src = url;

  preview.onload = () => {

    preview.classList.add("show");

  };

  preview.onerror = () => {

    preview.classList.remove("show");

  };

}


/* STATS */

function updateStats(){

  const allBooks =
    data.shelves.flatMap(
      shelf => shelf.books
    );


  const finished =
    data.shelves
      .find(s => s.id === "finished")
      ?.books.length || 0;


  const pagesRead =
    data.shelves
      .find(s => s.id === "finished")
      ?.books
      .reduce(
        (sum,book) =>
          sum + Number(book.pages || 0),
        0
      ) || 0;


  document.getElementById("totalBooks")
    .textContent = allBooks.length;

  document.getElementById("finishedBooks")
    .textContent = finished;

  document.getElementById("pagesRead")
    .textContent =
      pagesRead.toLocaleString();

}


/* CLOSE */

function closeModal(){

  document.getElementById("overlay")
    .classList.remove("show");

}


/* EFFECT */

function celebrate(symbol="✦"){

  playSound();

  for(let i=0;i<7;i++){

    const el =
      document.createElement("div");

    el.className = "float";

    el.textContent =
      Math.random() > .5
        ? symbol
        : "♡";


    el.style.left =
      (35 + Math.random()*30) + "vw";

    el.style.top =
      (55 + Math.random()*15) + "vh";

    el.style.animationDelay =
      (Math.random()*.15) + "s";

    document.body.appendChild(el);

    setTimeout(
      () => el.remove(),
      1600
    );

  }

}


/* SOUND */

function playSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value = 620;

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .035,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime + .18
    );


    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + .2
    );

  }catch(e){}

}


/* ESCAPE */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* CLICK OUTSIDE */

document.getElementById("overlay")
  .addEventListener(
    "click",
    e => {

      if(
        e.target.id === "overlay"
      ){

        closeModal();

      }

    }
  );


/* ESC KEY */

document.addEventListener(
  "keydown",
  e => {

    if(e.key === "Escape"){

      closeModal();

    }

  }
);


/* START */

render();

</script>
